[package]
name = "ai-multi-chat"
version = "0.1.0"
description = "AI 多模型对话客户端（Firefly）"
authors = ["Firefly"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
